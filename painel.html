<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel - Loja de Diamantes</title>
</head>

<body>
  <div id="login">
    <h1>🔐 Painel da Loja</h1>

    <input type="email" id="email" placeholder="E-mail"><br><br>
    <input type="password" id="senha" placeholder="Senha"><br><br>

    <button id="entrar">Entrar</button>

    <p id="erro"></p>
  </div>

  <div id="painel" style="display:none;">
    <h1>💎 Painel da Loja</h1>

    <button id="sair">Sair</button>

    <h2>📦 Pedidos</h2>

    <div id="pedidos">Carregando...</div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtWIRvhvXRf3YpjeToPGqIbCsHLu87tdM",
      authDomain: "loja-de-diamantes-f48bd.firebaseapp.com",
      databaseURL: "https://loja-de-diamantes-f48bd-default-rtdb.firebaseio.com",
      projectId: "loja-de-diamantes-f48bd",
      storageBucket: "loja-de-diamantes-f48bd.firebasestorage.app",
      messagingSenderId: "1003583191244",
      appId: "1:1003583191244:web:910b3dc3369b1898ee6a69",
      measurementId: "G-1XXZK0WZMZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const login = document.getElementById("login");
    const painel = document.getElementById("painel");
    const erro = document.getElementById("erro");

    document.getElementById("entrar").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
      } catch (e) {
        erro.innerText = "❌ E-mail ou senha incorretos.";
      }
    });

    document.getElementById("sair").addEventListener("click", () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        login.style.display = "none";
        painel.style.display = "block";
        carregarPedidos();
      } else {
        login.style.display = "block";
        painel.style.display = "none";
      }
    });

    function carregarPedidos() {
      const pedidosRef = ref(database, "pedidos");

      onValue(pedidosRef, (snapshot) => {
        const pedidos = snapshot.val();
        const area = document.getElementById("pedidos");

        if (!pedidos) {
          area.innerHTML = "<p>Nenhum pedido.</p>";
          return;
        }

        area.innerHTML = "";

        Object.entries(pedidos).reverse().forEach(([id, pedido]) => {
          const div = document.createElement("div");

          div.innerHTML = `
            <hr>
            <h3>🛒 Pedido</h3>
            <p><strong>💎 Pacote:</strong> ${pedido.pacote}</p>
            <p><strong>💰 Valor:</strong> ${pedido.valor}</p>
            <p><strong>🆔 ID Free Fire:</strong> ${pedido.idFreeFire}</p>
            <p><strong>📌 Status:</strong> ${pedido.status}</p>
            <p><strong>📅 Data:</strong> ${pedido.data}</p>
          `;

          area.appendChild(div);
        });
      });
    }
  </script>
</body>
</html>
