<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Diamantes</title>
</head>

<body>
  <h1>💎 Loja de Diamantes</h1>
  <p>Compre seus diamantes de forma rápida e segura!</p>

  <hr>

  <h2>Escolha seu pacote</h2>

  <button onclick="comprar('100 💎', 'R$ 2,00')">100 💎 - R$ 2,00</button><br><br>
  <button onclick="comprar('310 💎', 'R$ 5,00')">310 💎 - R$ 5,00</button><br><br>
  <button onclick="comprar('520 💎', 'R$ 8,00')">520 💎 - R$ 8,00</button><br><br>
  <button onclick="comprar('1060 💎', 'R$ 15,00')">1060 💎 - R$ 15,00</button><br><br>
  <button onclick="comprar('2180 💎', 'R$ 30,00')">2180 💎 - R$ 30,00</button><br><br>
  <button onclick="comprar('5600 💎', 'R$ 70,00')">5600 💎 - R$ 70,00</button>

  <div id="pedido" style="display:none;">
    <hr>
    <h2>🛒 Finalizar pedido</h2>

    <p id="pacoteEscolhido"></p>

    <label>ID do Free Fire:</label><br>
    <input type="text" id="idff" placeholder="Digite seu ID"><br><br>

    <button onclick="confirmarPedido()">Confirmar compra</button>

    <p id="resultado"></p>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtWIRvhvXRf3YpjeToPGqIbCsHLu87tdM",
      authDomain: "loja-de-diamantes-f48bd.firebaseapp.com",
      databaseURL: "https://loja-de-diamantes-f48bd-default-rtdb.firebaseio.com",
      projectId: "loja-de-diamantes-f48bd",
      storageBucket: "loja-de-diamantes-f48bd.firebasestorage.app",
      messagingSenderId: "1003583191244",
      appId: "1:1003583191244:web:910b3dc3369b1898ee6a69",
      measurementId: "G-1XXZK0WZMZ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let pacote = "";
    let preco = "";

    window.comprar = function(p, valor) {
      pacote = p;
      preco = valor;

      document.getElementById("pedido").style.display = "block";
      document.getElementById("pacoteEscolhido").innerText =
        "Pacote escolhido: " + pacote + " - " + preco;

      document.getElementById("pedido").scrollIntoView({
        behavior: "smooth"
      });
    };

    window.confirmarPedido = async function() {
      const id = document.getElementById("idff").value.trim();
      const resultado = document.getElementById("resultado");

      if (!id) {
        resultado.innerText = "❌ Digite seu ID do Free Fire.";
        return;
      }

      try {
        const novoPedido = push(ref(database, "pedidos"));

        await set(novoPedido, {
          pacote: pacote,
          valor: preco,
          idFreeFire: id,
          status: "Aguardando pagamento",
          data: new Date().toLocaleString("pt-BR")
        });

        resultado.innerText =
          "✅ Pedido confirmado! Aguarde a confirmação do pagamento.";

        document.getElementById("idff").value = "";
      } catch (erro) {
        resultado.innerText =
          "❌ Não foi possível enviar o pedido. Tente novamente.";
        console.error(erro);
      }
    };
  </script>
</body>
</html>
