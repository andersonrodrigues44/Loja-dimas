<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Diamantes</title>
</head>

<body>
  <h1>💎 Loja de Diamantes</h1>
  <p>Compre seus diamantes de forma rápida e segura!</p>

  <hr>

  <h2>Escolha seu pacote</h2>

  <button onclick="comprar('100 💎', 2)">100 💎 - R$ 2,00</button><br><br>
  <button onclick="comprar('310 💎', 5)">310 💎 - R$ 5,00</button><br><br>
  <button onclick="comprar('520 💎', 8)">520 💎 - R$ 8,00</button><br><br>
  <button onclick="comprar('1060 💎', 15)">1060 💎 - R$ 15,00</button><br><br>
  <button onclick="comprar('2180 💎', 30)">2180 💎 - R$ 30,00</button><br><br>
  <button onclick="comprar('5600 💎', 70)">5600 💎 - R$ 70,00</button>

  <div id="pedido" style="display:none;">
    <hr>

    <h2>🛒 Finalizar pedido</h2>

    <p id="pacoteEscolhido"></p>

    <label>ID do Free Fire:</label><br>
    <input
      type="text"
      id="idff"
      placeholder="Digite seu ID"
    >

    <br><br>

    <label>E-mail:</label><br>
    <input
      type="email"
      id="email"
      placeholder="Digite seu e-mail"
    >

    <br><br>

    <button onclick="confirmarPedido()">
      💳 Gerar Pix
    </button>

    <div id="resultado"></div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtWIRvhvXRf3YpjeToPGqIbCsHLu87tdM",
      authDomain: "loja-de-diamantes-f48bd.firebaseapp.com",
      databaseURL: "https://loja-de-diamantes-f48bd-default-rtdb.firebaseio.com",
      projectId: "loja-de-diamantes-f48bd",
      storageBucket: "loja-de-diamantes-f48bd.firebasestorage.app",
      messagingSenderId: "1003583191244",
      appId: "1:1003583191244:web:910b3dc3369b1898ee6a69",
      measurementId: "G-1XXZK0WZMZ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let pacote = "";
    let preco = 0;

    window.comprar = function(p, valor) {
      pacote = p;
      preco = valor;

      document.getElementById("pedido").style.display = "block";

      document.getElementById("pacoteEscolhido").innerText =
        "Pacote escolhido: " + pacote +
        " - R$ " + preco.toFixed(2).replace(".", ",");

      document.getElementById("pedido").scrollIntoView({
        behavior: "smooth"
      });
    };

    window.confirmarPedido = async function() {
      const id = document.getElementById("idff").value.trim();
      const email = document.getElementById("email").value.trim();
      const resultado = document.getElementById("resultado");

      if (!id) {
        resultado.innerHTML =
          "<p>❌ Digite seu ID do Free Fire.</p>";
        return;
      }

      if (!email) {
        resultado.innerHTML =
          "<p>❌ Digite seu e-mail.</p>";
        return;
      }

      resultado.innerHTML =
        "<p>⏳ Criando seu Pix...</p>";

      try {
        // =========================
        // CRIA O PIX NO MERCADO PAGO
        // =========================

        const respostaPix = await fetch("/api/pix", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            valor: preco,
            email: email,
            nome: "Cliente",
            descricao: "Compra de " + pacote
          })
        });

        const pix = await respostaPix.json();

        if (!respostaPix.ok || !pix.sucesso) {
          console.error(pix);

          resultado.innerHTML =
            "<p>❌ Não foi possível gerar o Pix.</p>";

          return;
        }

        // =========================
        // SALVA O PEDIDO NO FIREBASE
        // =========================

        const novoPedido = push(
          ref(database, "pedidos")
        );

        await set(novoPedido, {
          pacote: pacote,
          valor: "R$ " +
            preco.toFixed(2).replace(".", ","),
          idFreeFire: id,
          email: email,
          pagamentoId: pix.id,
          status: "Aguardando pagamento",
          data: new Date().toLocaleString("pt-BR")
        });

        // =========================
        // MOSTRA O PIX
        // =========================

        let qrImagem = "";

        if (pix.qr_code_base64) {
          qrImagem = `
            <img
              src="data:image/png;base64,${pix.qr_code_base64}"
              alt="QR Code Pix"
              style="width:250px;max-width:100%;"
            >
          `;
        }

        resultado.innerHTML = `
          <hr>

          <h3>✅ Pix criado!</h3>

          <p>
            <strong>Pacote:</strong>
            ${pacote}
          </p>

          <p>
            <strong>Valor:</strong>
            R$ ${preco.toFixed(2).replace(".", ",")}
          </p>

          ${qrImagem}

          <h3>📋 Pix Copia e Cola</h3>

          <textarea
            id="codigoPix"
            readonly
            style="width:100%;max-width:400px;height:120px;"
          >${pix.qr_code || ""}</textarea>

          <br><br>

          <button onclick="copiarPix()">
            📋 Copiar Pix
          </button>

          <p>
            Abra o aplicativo do seu banco,
            escolha Pix e faça o pagamento.
          </p>
        `;

        document.getElementById("idff").value = "";
        document.getElementById("email").value = "";

      } catch (erro) {
        console.error(erro);

        resultado.innerHTML =
          "<p>❌ Erro ao conectar com o pagamento.</p>";
      }
    };

    window.copiarPix = function() {
      const campo =
        document.getElementById("codigoPix");

      if (!campo) return;

      navigator.clipboard.writeText(campo.value);

      alert("✅ Pix copiado!");
    };
  </script>
</body>
  </html>
